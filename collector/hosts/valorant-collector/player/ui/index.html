<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Riot Overlay — Player</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Riot Overlay <span>bản Player</span></h1>
        <p id="phase" class="pill">đang khởi động…</p>
      </header>
      <p id="detail" class="detail"></p>

      <section>
        <h2>1. Nhập code của host</h2>
        <form id="join-form">
          <input
            id="code"
            name="code"
            inputmode="latin"
            autocomplete="off"
            spellcheck="false"
            maxlength="5"
            placeholder="ABCDE"
            aria-label="Code của host"
          />
          <button type="submit">Kết nối</button>
        </form>
        <p class="hint">Code gồm 5 ký tự. Camera được nối tự động khi client nhận diện player.</p>
      </section>

      <section>
        <h2>2. Kết nối</h2>
        <dl id="client" class="facts">
          <div class="fact"><dt>Kết nối tới host</dt><dd id="f-connected">—</dd></div>
          <div class="fact"><dt>Tên player</dt><dd id="f-player">—</dd></div>
        </dl>
        <button id="leave" class="ghost" type="button">Dừng kết nối</button>
      </section>

      <section>
        <h2>3. Camera</h2>
        <div class="row">
          <button id="cam-toggle" type="button">Mở camera</button>
          <button id="cam-test" class="ghost" type="button">Preview camera</button>
        </div>
        <p id="cam-wait" class="hint" hidden></p>
        <p id="cam-problem" class="warn" hidden></p>
        <div id="cam-frame" class="frame" hidden></div>
        <video id="cam-preview" playsinline muted hidden></video>
        <p class="hint">Camera chỉ truyền hình, đã tắt microphone và âm thanh hai chiều.</p>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
